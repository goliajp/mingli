# 仓库里已经有 699 条测试、五条脚本、一套截图断言——但它们此前只在有人想起来时才跑。
# 这个 workflow 把它们全部接上，一条也不新造：每一项都是 README 与接续手册里已经写着的关卡。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: 测试 · clippy · doc · feature 矩阵 · 契约快照
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链（含 wasm32 目标，feature 矩阵要用）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps

      - name: feature 矩阵（5 种组合 + wasm32 两条 + 查依赖图）
        run: ./scripts/feature-matrix.sh

      # 两件事，都不是同义反复：
      # 1. 36 个请求没有一个把服务打崩、也没有一个连不上（`000` 是连不上——
      #    它长得跟「所有端点都变了」一模一样，必须单独拎出来认）
      # 2. save 与 check 各自起一个**新进程**，于是这一步顺带是一次跨进程确定性检查。
      #    Rust 的 HashMap 每进程换一个随机种子，遍历它就会让同一份构建在两次运行里
      #    吐出不同的字节——`/api/analysis` 当初正是这么坏的，而同一进程内跑两遍看不出来。
      #    「改动前后逐字节一致」那一半 CI 里确实做不了（没有改动前），留给本地。
      - name: 37 个请求：无 5xx、无连不上，且两个进程给出同一份字节
        run: |
          cargo build -p mingli-api
          ./scripts/api-snapshot.sh save /tmp/snap.txt
          bad=$(grep -E '^(000|5[0-9]{2})$' /tmp/snap.txt || true)
          test -z "$bad" || { echo "出现异常状态码：$bad"; grep -B2 -E '^(000|5[0-9]{2})$' /tmp/snap.txt; exit 1; }
          ./scripts/api-snapshot.sh check /tmp/snap.txt

      - name: README 自称的测试数
        run: ./scripts/test-count.sh

      - name: guards actually guard
        run: ./scripts/guard-probe.sh

      # 依赖公告。放在 Rust job 末尾而非单开定时任务：定时任务的失败没人盯，
      # 而这条挂在每次 push 上，出了公告当场就知道。
      # 公告库是外部的、会自己更新，所以这一步可能在没有任何改动的情况下变红——
      # 那不是误报，是「今天这份依赖不再干净了」。
      - name: 依赖安全公告
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  web:
    name: 前端构建 · 截图断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: 装依赖与 Chromium
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - run: cargo build -p mingli-api

      - name: 起后端（:6027），等它真的应答
        run: |
          ./target/debug/mingli-api &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 60); do
            curl -sf localhost:6027/api/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:6027/api/health >/dev/null

      - name: 构建前端
        working-directory: web
        run: bun run build

      - name: 起前端（:6026），等它真的应答
        working-directory: web
        run: |
          bun run dev &
          for _ in $(seq 1 60); do
            curl -sf localhost:6026/ >/dev/null && break
            sleep 1
          done
          curl -sf localhost:6026/ >/dev/null

      # 30 屏 × 2 视口 + 8 屏断言 + 「静止三秒里还在不在发请求」
      - name: 截图与断言
        working-directory: web
        run: bun run shots

      - name: 断言不过时把截图留下
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: web/e2e/shots/
