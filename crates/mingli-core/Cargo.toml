[package]
name = "mingli-core"
description = "元 crate（树之根/数学石）：循环群+CRT、角度量化、二进制格+GF(2)、哈希环、群作用/置换、可审计随机。纯数学，零世界数据、零依赖。"
edition.workspace = true
version.workspace = true
license.workspace = true

# 数学石必须零依赖：它是整棵树的根，放大半径=全栈。
[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# 仅测试期：基于性质的测试（随机输入验不变量）。不进运行时依赖，根仍零依赖。
proptest = "1"

[lints]
workspace = true

[[bench]]
name = "core_bench"
harness = false
