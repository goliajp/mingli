[package]
name = "mingli-astro"
description = "Computational astronomy and calendrics: Julian day, apparent solar longitude and the 24 solar terms, lunar phase and lunisolar intercalation, and the sexagenary cycle."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "calendar", "solar-terms", "lunisolar"]
categories = ["date-and-time", "science", "algorithms"]

[dependencies]
mingli-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
# 结构体的 `Serialize`。只想拿类型化结果的调用方可以 `default-features = false` 关掉它，
# 那样整条依赖链上不会出现 serde（连同 serde_derive / syn 两个 proc-macro）。
serde = ["dep:serde"]

[dev-dependencies]
# 只为一条对照测试：`astro` 是 Meeus 第 49 章朔望时刻的另一份转写。
# 算法不独立，转写独立——抄错一个系数两边立刻分岔，而实测它们逐位相同。
astro = "2"
# 仅测试期：基于性质的测试。
proptest = "1"

[lints]
workspace = true
