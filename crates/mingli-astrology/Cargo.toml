[package]
name = "mingli-astrology"
description = "Western natal charts: planets in signs and houses with aspects, over Placidus, Koch, Whole Sign, Equal and Porphyry cusps."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astrology", "natal-chart", "placidus", "houses"]
categories = ["science", "algorithms"]

[dependencies]
serde_json = { workspace = true, optional = true }
mingli-contract = { workspace = true, optional = true }
mingli-core = { workspace = true }
mingli-astro = { workspace = true }
# 这片叶自己算行星位置，所以显式要那份级数表。
# 根 manifest 缺省关着它——整仓一起构建时会被别的 crate 的 feature 合并掩盖，
# 单独构建才炸，而 scripts/leaf-deps.sh 正是单独构建的。
mingli-ephemeris = { workspace = true, features = ["vsop87"] }
serde = { workspace = true, optional = true }

[features]
default = ["port", "ephemeris"]
# 作为一片叶接进注册表所需的一切：`CastingEngine` 实现与它的 JSON 出口。
# 只想直接调本 crate 的类型化 API 的人不需要它——关掉之后契约与 serde_json 都不进依赖图。
port = ["dep:mingli-contract", "dep:serde_json", "serde", "ephemeris"]
# 盘面结构体的 `Serialize`。
ephemeris = ["mingli-ephemeris/vsop87"]
# 本地星历的轻量档：同一份系数丢掉振幅低于 1e-6 的项。
# 实测（wasm32 -Oz）810,521 → 89,595 字节，少 89%；代价是地心黄经最多差 4.28 角秒，
# 而公开盘只精确到角分（60″）。残差由 mingli-ephemeris 的测试对着全量钉住。
ephemeris-lite = ["ephemeris", "mingli-ephemeris/eph-lite"]
serde = ["dep:serde", "mingli-astro/serde", "mingli-ephemeris/serde"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[lints]
workspace = true

[[bench]]
name = "astrology_bench"
harness = false
