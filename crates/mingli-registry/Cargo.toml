[package]
name = "mingli-registry"
description = "装配根：唯一知道「树上有哪些叶」的地方。把各叶的 CastingEngine / WordEngine 实现装配成注册表，交给编排层消费。加新叶只需在此登记一行。"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mingli-contract = { workspace = true }

mingli-bazi = { workspace = true }
mingli-ziwei = { workspace = true }
# 占星族连带 VSOP87 星历（唯一重依赖），做成 feature 可裁（默认开）。
mingli-astrology = { workspace = true, optional = true }
mingli-jyotish = { workspace = true, optional = true }
mingli-qizhengsiyu = { workspace = true, optional = true }
mingli-yijing = { workspace = true }
mingli-geomancy = { workspace = true }
mingli-sikidy = { workspace = true }
mingli-ifa = { workspace = true }
mingli-cartomancy = { workspace = true }
mingli-meihua = { workspace = true }
mingli-xiaoliuren = { workspace = true }
mingli-zeri = { workspace = true }
mingli-maya = { workspace = true }
mingli-pawukon = { workspace = true }
mingli-mahabote = { workspace = true }
mingli-liuren = { workspace = true }
mingli-qimen = { workspace = true }
mingli-taiyi = { workspace = true }
mingli-tibetan = { workspace = true }
mingli-numerology = { workspace = true }
mingli-gematria = { workspace = true }
mingli-abjad = { workspace = true }
mingli-wuge = { workspace = true }

[features]
default = ["astrology", "jyotish", "qizhengsiyu"]
# 西洋占星叶（B 族）：连带 VSOP87 星历。关掉可得轻量构建（如轻 wasm）。
astrology = ["dep:mingli-astrology"]
# 印度占星（Jyotish）叶，依赖行星星历与上升点几何。
jyotish = ["dep:mingli-jyotish"]
# 七政四余（中国本土星占）叶。
qizhengsiyu = ["dep:mingli-qizhengsiyu"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
mingli-contract = { workspace = true }
mingli-engine = { workspace = true }
mingli-astro = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "tree_bench"
harness = false
