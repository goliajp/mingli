[package]
name = "mingli-registry"
description = "The composition root: the one place that knows which divination systems exist. Registering a leaf is one line here."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["registry", "divination", "composition", "plugin"]
categories = ["algorithms", "api-bindings"]

[dependencies]
mingli-contract = { workspace = true }

mingli-bazi = { workspace = true, optional = true }
mingli-ziwei = { workspace = true, optional = true }
# 占星族连带 VSOP87 星历（唯一重依赖），做成 feature 可裁（默认开）。
mingli-astrology = { workspace = true, optional = true }
mingli-jyotish = { workspace = true, optional = true }
mingli-qizhengsiyu = { workspace = true, optional = true }
mingli-yijing = { workspace = true, optional = true }
mingli-geomancy = { workspace = true, optional = true }
mingli-sikidy = { workspace = true, optional = true }
mingli-ifa = { workspace = true, optional = true }
mingli-cartomancy = { workspace = true, optional = true }
mingli-meihua = { workspace = true, optional = true }
mingli-xiaoliuren = { workspace = true, optional = true }
mingli-zeri = { workspace = true, optional = true }
mingli-maya = { workspace = true, optional = true }
mingli-pawukon = { workspace = true, optional = true }
mingli-mahabote = { workspace = true, optional = true }
mingli-liuren = { workspace = true, optional = true }
mingli-qimen = { workspace = true, optional = true }
mingli-taiyi = { workspace = true, optional = true }
mingli-tibetan = { workspace = true, optional = true }
mingli-numerology = { workspace = true, optional = true }
mingli-gematria = { workspace = true, optional = true }
mingli-abjad = { workspace = true, optional = true }
mingli-wuge = { workspace = true, optional = true }

[features]
# 缺省装配全部二十四片叶。想只要其中几片，`default-features = false` 后逐片开——
# 每片一个 feature，名字即叶 id。浏览器里这件事是有分量的：整包 1.8 MB，
# 只要四柱一片是 0.28 MB。
# 装全部。给「我全都要」一个名字——服务端与开发构建用它，
# 而不是把二十四个 feature 名抄一遍（抄漏一个就少一片叶，且不会有任何报错）。
full = [
    "bazi",
    "ziwei",
    "astrology",
    "jyotish",
    "qizhengsiyu",
    "yijing",
    "geomancy",
    "sikidy",
    "ifa",
    "cartomancy",
    "meihua",
    "xiaoliuren",
    "zeri",
    "maya",
    "pawukon",
    "mahabote",
    "liuren",
    "qimen",
    "taiyi",
    "tibetan",
    "numerology",
    "gematria",
    "abjad",
    "wuge",
]
default = [
    "bazi", "ziwei", "astrology", "jyotish", "qizhengsiyu", "yijing", "geomancy", "sikidy",
    "ifa", "cartomancy", "meihua", "xiaoliuren", "zeri", "maya", "pawukon", "mahabote",
    "liuren", "qimen", "taiyi", "tibetan", "numerology", "gematria", "abjad", "wuge",
]
bazi = ["dep:mingli-bazi"]
ziwei = ["dep:mingli-ziwei"]
# 整片叶（含本地 VSOP87 星历）。
astrology = ["dep:mingli-astrology", "mingli-astrology/port"]
# 只要它的排盘部分，不含本地星历——行星位置由调用方给。
#
# 实测（wasm32，-Oz）：同一段排盘代码，位置本地算 857,633 字节，位置由调用方给
# 79,863 字节，差 777,770（90.7%）。差的那一份是 VSOP87D 的常量表。
# 宿主已经有星历时（浏览器里有几十 KB 的 JS 实现），这一档省下的是整整一份表。
astrology-lite = ["dep:mingli-astrology", "mingli-astrology/serde"]
# 整片叶，但本地星历走截断表。体积比整片叶小约 720 KB，精度让 4.28 角秒。
astrology-thin = ["dep:mingli-astrology", "mingli-astrology/port", "mingli-astrology/ephemeris-lite"]
jyotish = ["dep:mingli-jyotish"]
qizhengsiyu = ["dep:mingli-qizhengsiyu"]
yijing = ["dep:mingli-yijing"]
geomancy = ["dep:mingli-geomancy"]
sikidy = ["dep:mingli-sikidy"]
ifa = ["dep:mingli-ifa"]
cartomancy = ["dep:mingli-cartomancy"]
meihua = ["dep:mingli-meihua"]
xiaoliuren = ["dep:mingli-xiaoliuren"]
zeri = ["dep:mingli-zeri"]
maya = ["dep:mingli-maya"]
pawukon = ["dep:mingli-pawukon"]
mahabote = ["dep:mingli-mahabote"]
liuren = ["dep:mingli-liuren"]
qimen = ["dep:mingli-qimen"]
taiyi = ["dep:mingli-taiyi"]
tibetan = ["dep:mingli-tibetan"]
numerology = ["dep:mingli-numerology"]
gematria = ["dep:mingli-gematria"]
abjad = ["dep:mingli-abjad"]
wuge = ["dep:mingli-wuge"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
mingli-contract = { workspace = true }
mingli-engine = { workspace = true }
mingli-astro = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "tree_bench"
harness = false
