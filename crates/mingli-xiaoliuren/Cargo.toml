[package]
name = "mingli-xiaoliuren"
description = "Xiao Liu Ren, the roadside reckoning: lunar month, day and double-hour counted around Z6 onto one of six deities. Fully determined by the moment."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["xiaoliuren", "divination", "chinese", "cyclic"]
categories = ["algorithms", "date-and-time"]

[dependencies]
serde_json = { workspace = true, optional = true }
mingli-contract = { workspace = true, optional = true }
mingli-core = { workspace = true }
mingli-astro = { workspace = true }
mingli-ganzhi = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["port"]
# 作为一片叶接进注册表所需的一切：`CastingEngine` 实现与它的 JSON 出口。
# 只想直接调本 crate 的类型化 API 的人不需要它——关掉之后契约与 serde_json 都不进依赖图。
port = ["dep:mingli-contract", "dep:serde_json", "serde"]
# 盘面结构体的 `Serialize`。
serde = ["dep:serde", "mingli-astro/serde", "mingli-ganzhi/serde"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[lints]
workspace = true

[[bench]]
name = "xiaoliuren_bench"
harness = false
