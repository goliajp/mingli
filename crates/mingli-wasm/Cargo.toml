[package]
name = "mingli-wasm"
description = "WebAssembly bindings for the whole library: all eight intents, taking the same request bodies the HTTP endpoints take, so a browser can run the engine with no server."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["wasm", "divination", "bindings", "browser"]
categories = ["wasm", "api-bindings", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mingli-contract = { workspace = true }
mingli-engine = { workspace = true }
mingli-registry = { workspace = true }
mingli-app = { workspace = true }
mingli-interpret = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[features]
default = ["astrology"]
# 关掉得轻量 wasm（去掉占星 + VSOP87 星历）。
astrology = ["mingli-registry/astrology"]

[lints]
workspace = true
