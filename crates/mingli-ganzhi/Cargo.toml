[package]
name = "mingli-ganzhi"
description = "The sexagenary cycle as a symbol system: stems and branches, the five-tiger rule, double-hours, nayin elements, and day-pillar recursion."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["sexagenary", "ganzhi", "calendar", "chinese"]
categories = ["date-and-time", "algorithms"]

[dependencies]
mingli-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
# 结构体的 `Serialize`。只想拿类型化结果的调用方可以 `default-features = false` 关掉它，
# 那样整条依赖链上不会出现 serde（连同 serde_derive / syn 两个 proc-macro）。
serde = ["dep:serde"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[lints]
workspace = true

[[bench]]
name = "ganzhi_bench"
harness = false
