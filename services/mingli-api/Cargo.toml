[package]
name = "mingli-api"
description = "The axum service: every divination system over HTTP JSON, one endpoint per intent, plus the interpretation endpoints."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["axum", "divination", "http", "api"]
categories = ["web-programming::http-server", "algorithms"]

[dependencies]
mingli-contract = { workspace = true }
mingli-engine = { workspace = true }
# 本服务装全部二十四片叶——「全都要」在这里是显式声明，不是缺省
mingli-registry = { workspace = true, features = ["full"] }
mingli-app = { workspace = true, features = ["astrology", "jyotish"] }
mingli-interpret = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mingli-wasm = { path = "../../crates/mingli-wasm" }
